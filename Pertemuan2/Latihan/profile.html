<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Halaman Profile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
        }

        .container {
            display: grid;
            grid-template-rows: auto auto 1fr auto;
            grid-template-columns: 1fr;
            min-height: 100vh;
        }

        .header {
            background-color: #f4f4f4;
            padding: 1rem;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        .nav-container {
            background-color: #e9e9e9;
            padding: 0.5rem 1rem;
            display: flex;
            justify-content: flex-end;
            border-bottom: 1px solid #ddd;
        }

        .nav a {
            margin-left: 1rem;
            text-decoration: none;
            color: #333;
            padding: 0.5rem;
        }

        .nav a:hover {
            background-color: #ddd;
            border-radius: 4px;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            gap: 1rem;
            padding: 1rem;
            flex: 1;
        }

        .sidebar, .ads {
            background-color: #f9f9f9;
            padding: 1rem;
            border-radius: 4px;
            border: 1px solid #ddd;
        }

        .content {
            background-color: #fff;
            padding: 1rem;
            border-radius: 4px;
            border: 1px solid #ddd;
        }

        .footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 1rem;
        }

        /* Layout Halaman Administrator */
        .admin-container {
            display: grid;
            grid-template-rows: auto 1fr auto;
            grid-template-columns: 1fr;
            min-height: 100vh;
        }

        .admin-header {
            background-color: #f4f4f4;
            padding: 1rem;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        .admin-main {
            display: grid;
            grid-template-columns: 1fr 3fr;
            gap: 1rem;
            padding: 1rem;
            flex: 1;
        }

        .admin-sidebar {
            background-color: #f9f9f9;
            padding: 1rem;
            border-radius: 4px;
            border: 1px solid #ddd;
        }

        .admin-sidebar ul {
            list-style-type: none;
        }

        .admin-sidebar li {
            margin-bottom: 0.5rem;
        }

        .admin-sidebar a {
            text-decoration: none;
            color: #333;
            display: block;
            padding: 0.5rem;
        }

        .admin-sidebar a:hover {
            background-color: #ddd;
            border-radius: 4px;
        }

        .admin-content {
            background-color: #fff;
            padding: 1rem;
            border-radius: 4px;
            border: 1px solid #ddd;
        }

        .admin-footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 1rem;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .admin-main {
                grid-template-columns: 1fr;
            }
            
            .nav-container {
                justify-content: center;
            }
            
            .nav a {
                margin: 0 0.5rem 0.5rem 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Header</h1>
        </header>
        
        <div class="nav-container">
            <nav class="nav">
                <a href="#">Beranda</a>
                <a href="#">Produk</a>
                <a href="#">Member</a>
                <a href="#">Login</a>
            </nav>
        </div>
        
        <main class="main-content">
            <aside class="sidebar">
                <h2>Populer</h2>
                <p>Populer.</p>
            </aside>
            
            <section class="content">
                <h2>Konten Dinamis</h2>
                <p>Konten Dinamis.</p>
            </section>
            
            <aside class="ads">
                <h2>Iklan</h2>
                <p>Iklan dan Promosi.</p>
            </aside>
        </main>
        
        <footer class="footer">
            <p>&copy; 2025 Website Untuk Memenuhi Tugas Modul Pertama.</p>
        </footer>
    </div>
</body>
</html>
