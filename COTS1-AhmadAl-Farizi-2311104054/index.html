<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beranda - Toko Web</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header class="bg-light py-3 border-bottom">
        <div class="container">
            <nav class="navbar navbar-expand-lg navbar-light">
                <a class="navbar-brand" href="index.html">
                    <img src="assets/img/logo.png" alt="" height="100"></a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link active" href="#">Beranda</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">Produk</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">Login</a></li>
                    </ul>
                </div>
            </nav>
        </div>
    </header>

    <main>
        <div id="mainCarousel" class="carousel slide" data-bs-ride="carousel">
            <div class="carousel-inner">
                <div class="carousel-item active"><img src="assets/img/laptop1.png" class="d-block w-100" alt="Banner 1" height="1000" width="1000"></div>
                <div class="carousel-item"><img src="assets/img/monitor1.png" class="d-block w-100" alt="Banner 2" height="1000" width="1000"></div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#mainCarousel" data-bs-slide="prev"><span class="carousel-control-prev-icon"></span></button>
            <button class="carousel-control-next" type="button" data-bs-target="#mainCarousel" data-bs-slide="next"><span class="carousel-control-next-icon"></span></button>
        </div>

        <div class="container mt-4">
            <div class="row mb-4">
                <div class="col-12"><form id="searchForm"><input type="text" id="searchInput" class="form-control" placeholder="Kolom Pencarian"></form></div>
            </div>

            <div class="row g-4"> 
                <div class="col-lg-6">
                    <div class="content-section">
                        <h3 class="mb-3">Rekomendasi</h3>
                        <div id="recommended-grid" class="row g-3">
                        </div>
                    </div>
                </div>
                <div class="col-lg-6">
                    <div class="content-section">
                        <h3 class="mb-3">Daftar Barang Lainnya</h3>
                        <div id="other-products-grid" class="row g-3">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">Electronic Arts Store by Ahmad Al Farizi 2311104054</p>
    </footer>

    <div id="notification" class="notification"></div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
